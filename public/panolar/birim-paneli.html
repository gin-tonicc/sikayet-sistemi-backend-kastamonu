<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birim Paneli · Kastamonu Belediyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --marine-900:#0F2C5C; --marine-800:#163B73; --marine-700:#1B4E97; --marine-600:#2A5CAE;
  --rule:#2F5590; --teal-soft:#9FC1F2;
  --bone:#FFFFFF; --bone-dim:#EEF2F7; --hair:#DCE3EC;
  --ink:#14181C; --ink-soft:#5A646E;
  --iyi:#1B7F4B; --iyi-bg:#E8F4ED;
  --orta:#B5730B; --orta-bg:#FBF2E0;
  --acil:#B71C24; --acil-bg:#FBE9EA;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bone-dim);color:var(--ink);
  font-size:16px;line-height:1.55}
h1,h2,h3{font-family:'Oswald',sans-serif}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--orta);outline-offset:2px}

.btn{font-family:'Oswald',sans-serif;font-size:15px;font-weight:500;letter-spacing:.01em;
  padding:13px 20px;border-radius:4px;border:1.5px solid var(--hair);background:var(--bone);
  color:var(--ink);cursor:pointer;min-height:46px}
.btn:hover{border-color:var(--marine-600)}
.btn.ana{background:var(--marine-800);color:#fff;border-color:var(--marine-800)}
.btn.ana:hover{background:var(--marine-900)}
.btn.yesil{background:var(--iyi);color:#fff;border-color:var(--iyi)}
.btn.kirmizi{background:var(--acil);color:#fff;border-color:var(--acil)}
input[type=text],input[type=email],input[type=password],select,textarea{
  padding:12px 13px;border:1.5px solid var(--hair);border-radius:4px;background:var(--bone);
  width:100%;font-size:16px}
textarea{min-height:90px;resize:vertical}

/* ---------- uygulama iskeleti ---------- */
.tepe{background:var(--marine-900);color:#fff;padding:16px 20px;display:flex;
  justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.tepe .kas{font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--orta)}
.tepe .marka{font-family:'Oswald',sans-serif;font-weight:500;font-size:19px;text-transform:uppercase;
  letter-spacing:.01em}

/* ---------- sağ üstteki slot seçici (giriş ekranının yerine) ---------- */
.slot-secici{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot-etiket{font-size:12px;color:var(--teal-soft);text-transform:uppercase;
  letter-spacing:.1em;font-family:'Oswald',sans-serif;margin-right:2px}
.slot-btn{font-family:'Oswald',sans-serif;font-size:13.5px;letter-spacing:.02em;white-space:nowrap;
  padding:9px 14px;border-radius:4px;border:1.5px solid var(--rule);background:transparent;
  color:var(--teal-soft);cursor:pointer;min-height:38px}
.slot-btn:hover{border-color:var(--teal-soft);color:#fff}
.slot-btn[aria-current=true]{background:var(--bone);color:var(--marine-900);
  border-color:var(--bone);font-weight:600}
.slot-btn.yonetici[aria-current=true]{background:var(--orta);color:#fff;border-color:var(--orta)}

.sekmeler{display:flex;gap:2px;background:var(--marine-800);padding:0 20px;overflow-x:auto}
.sekmeler button{background:none;border:none;padding:14px 18px;font-family:'Oswald',sans-serif;
  font-size:14px;letter-spacing:.02em;color:var(--teal-soft);cursor:pointer;
  border-bottom:3px solid transparent;white-space:nowrap}
.sekmeler button[aria-current=page]{color:#fff;border-bottom-color:var(--orta)}

.kabuk{max-width:1100px;margin:0 auto;padding:22px 20px 70px}

/* ---------- takip numarası arama ---------- */
.arama-kutu{background:var(--marine-800);padding:12px 20px;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap}
.arama-kutu input{max-width:280px}
.arama-sonuc{font-size:13.5px;color:var(--acil-bg)}

/* ---------- basit özet kartları ---------- */
.ozet-satir{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.ozet{background:var(--bone);border:1px solid var(--hair);border-radius:4px;padding:16px 18px}
.ozet.dikkat{border-color:var(--acil);background:var(--acil-bg)}
.ozet .et{font-size:13.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:500}
.ozet .deger{font-family:'Oswald',sans-serif;font-size:32px;font-weight:600;line-height:1;color:var(--marine-800)}
.ozet.dikkat .deger{color:var(--acil)}
.ozet .alt{font-size:13px;color:var(--ink-soft);margin-top:5px}

.aciklama-kutu{font-size:14.5px;color:var(--ink-soft);margin-bottom:16px;max-width:65ch}

/* ---------- iş kartları (liste) ---------- */
.is-kart{width:100%;text-align:left;background:var(--bone);border:1px solid var(--hair);
  border-left:5px solid var(--hair);border-radius:4px;padding:16px 18px;margin-bottom:10px;
  cursor:pointer;display:block}
.is-kart:hover{border-color:var(--marine-600);border-left-color:var(--marine-600)}
.is-kart[data-yas="orta"]{border-left-color:var(--orta)}
.is-kart[data-yas="uzun"]{border-left-color:var(--acil)}
.is-ust{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.is-ust .baslik{font-size:16.5px;font-weight:600;color:var(--ink)}
.is-alt{font-size:14px;color:var(--ink-soft);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.is-yas{font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--ink-soft);margin-left:auto;
  white-space:nowrap}
.is-yas.uzun{color:var(--acil);font-weight:600}
.foto-isareti{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--marine-700);
  background:var(--bone-dim);padding:2px 8px;border-radius:20px}

.rozet{font-family:'Oswald',sans-serif;font-size:12px;font-weight:500;letter-spacing:.04em;
  text-transform:uppercase;padding:4px 10px;border-radius:20px}
.rozet.acil{background:var(--acil-bg);color:var(--acil)}
.rozet.triyaj{background:var(--orta-bg);color:var(--orta)}
.rozet.yeni{background:#E7EEF8;color:var(--marine-700)}
.rozet.islemde{background:var(--bone-dim);color:var(--ink-soft)}
.rozet.beklemede{background:var(--orta-bg);color:var(--orta)}
.rozet.cozuldu,.rozet.kapandi{background:var(--iyi-bg);color:var(--iyi)}

.bos{padding:50px 20px;text-align:center;color:var(--ink-soft);font-size:16px;background:var(--bone);
  border:1px dashed var(--hair);border-radius:4px}

/* ---------- yönetici tablosu (sadece Yönetici Panosu slotunda) ---------- */
table{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--bone)}
th{text-align:left;font-family:'Oswald',sans-serif;font-weight:500;font-size:12.5px;
  text-transform:uppercase;letter-spacing:.04em;color:var(--marine-900);padding:11px 12px;
  border-bottom:2px solid var(--marine-800)}
td{padding:11px 12px;border-bottom:1px solid var(--hair)}
td.sag,th.sag{text-align:right}

/* ---------- detay penceresi ---------- */
.perde{position:fixed;inset:0;background:rgba(15,44,92,.55);display:none;align-items:center;
  justify-content:center;padding:16px;z-index:40}
.perde.acik{display:flex}
.modal{background:var(--bone);border-radius:4px;max-width:680px;width:100%;max-height:90vh;
  overflow:auto}
.modal-bas{padding:18px 20px;background:var(--marine-900);color:#fff;display:flex;
  justify-content:space-between;align-items:flex-start;gap:14px}
.modal-bas h2{font-size:18px;font-weight:500}
.modal-bas .no{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--teal-soft);margin-top:4px}
.modal-ic{padding:22px 20px}
.alan{margin-bottom:16px}
.alan label{font-size:13.5px;font-weight:600;color:var(--ink);display:block;margin-bottom:6px}
.bilgi{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;font-size:15px;margin-bottom:20px}
.bilgi span{color:var(--ink-soft);font-weight:500}

.foto-serit{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.foto-serit a{display:block;width:96px;height:96px;border-radius:4px;overflow:hidden;
  border:1px solid var(--hair)}
.foto-serit img{width:100%;height:100%;object-fit:cover;display:block}
.foto-yukleniyor{font-size:13.5px;color:var(--ink-soft)}

.eylemler{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.gecmis{border-top:1px solid var(--hair);margin-top:22px;padding-top:16px}
.gecmis h3{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--ink)}
.gecmis li{list-style:none;font-size:13.5px;color:var(--ink-soft);padding:7px 0;
  border-bottom:1px solid var(--bone-dim)}
.gecmis li time{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);
  margin-right:8px;display:block}

.uyari{background:var(--orta-bg);border:1px solid #EBD4A0;border-radius:4px;padding:13px 15px;
  font-size:14px;color:#7A4E05;margin-bottom:16px;line-height:1.5}

@media(max-width:640px){
  .bilgi{grid-template-columns:1fr}
  .bilgi span{margin-top:8px}
  .arama-kutu input{max-width:none;flex:1}
}
</style>
</head>
<body>

<div id="uygulama"><div class="bos">Yükleniyor…</div></div>
<div class="perde" id="perde"><div class="modal" id="modal"></div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* =====================================================================
   AYAR — Supabase panelinden alınır (Project Settings > API)
   DEMO SÜRÜMÜ: giriş ekranı yok, publishable anahtar tarayıcıda durur.
   Kimin hangi kaydı göreceğini veritabanındaki RLS politikaları belirler.
   ===================================================================== */
const AYAR = {
  url:  'https://bjdgwefzqzassnilvvyn.supabase.co',
  anon: 'sb_publishable_X8H7wHFr8KcdIoJc-EFoWw_EnMKXmeO',
};

const sb = createClient(AYAR.url, AYAR.anon);

const DURUM_ADI = {
  triyaj: 'Değerlendiriliyor', yeni: 'Yeni', atandi: 'Atandı', islemde: 'İşleme alındı',
  beklemede: 'Vatandaş onayı bekliyor', havale: 'Başka kuruma yönlendirildi', cozuldu: 'Çözüldü',
  kapandi: 'Kapandı', tekrar_acildi: 'Yeniden açıldı', reddedildi: 'Reddedildi',
};
const ACIK_DURUMLAR = ['triyaj', 'yeni', 'atandi', 'islemde', 'beklemede', 'tekrar_acildi'];

/* SEC: seçili slot. 'yonetici' ya da bir birim id'si.
   Sağ üstteki düğmelerden değişir — giriş yapan kişiye göre değil. */
let SEC = 'yonetici', SAYFA = 'panos', KAYITLAR = [], BIRIMLER = [], KANAL = null;

await baslat();

async function baslat() {
  const { data: birimler } = await sb.from('birimler').select('id, ad, kisa_ad').eq('aktif', true).order('ad');
  BIRIMLER = birimler ?? [];
  await kayitlariGetir();
  canliBagla();
  ciz();
}

/* ---------------- veri ---------------- */

async function kayitlariGetir() {
  const { data, error } = await sb.from('sikayetler')
    .select(`id, takip_no, baslik, ozet, durum, oncelik, acil, olusturma, cozum_tarihi,
             mahalle_metin, adres, ai_guven, ai_gerekce, destekleyen_sayisi, sla_bitis, birim_id,
             kategoriler ( ad ), birimler ( ad, kisa_ad ),
             sikayet_ekleri ( id, dosya_yolu, tip )`)
    .order('acil', { ascending: false })
    .order('olusturma', { ascending: false })
    .limit(500);
  if (error) { console.error(error); return; }
  KAYITLAR = data ?? [];
}

// Canlı bağlantı: veritabanına yeni kayıt düştüğü anda liste güncellenir
function canliBagla() {
  if (KANAL) sb.removeChannel(KANAL);
  KANAL = sb.channel('sikayet-akisi')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sikayetler' },
      async () => { await kayitlariGetir(); ciz(); })
    .subscribe();
}

/* ---------------- çizim ---------------- */

function ciz() {
  const yonetici = SEC === 'yonetici';
  const birim = BIRIMLER.find(b => b.id === SEC);
  const sekmeler = [
    ['gelen', 'Bana gelen işler'],
    ['bekleyen', 'Onay bekleyenler'],
    ...(yonetici ? [['triyaj', 'Yönlendirme kutusu'], ['panos', 'Genel durum']] : []),
    ['kapali', 'Biten işler'],
  ];
  if (!sekmeler.some(([k]) => k === SAYFA)) SAYFA = yonetici ? 'panos' : 'gelen';

  document.getElementById('uygulama').innerHTML = `
    <div class="tepe">
      <div><div class="kas">Kastamonu Belediyesi</div><div class="marka">Birim Paneli</div></div>
      <div class="slot-secici">
        <span class="slot-etiket">Görünüm:</span>
        <button class="slot-btn yonetici" data-slot="yonetici" ${yonetici ? 'aria-current="true"' : ''}>Yönetici</button>
        ${BIRIMLER.map(b => `<button class="slot-btn" data-slot="${b.id}"
          ${b.id === SEC ? 'aria-current="true"' : ''}>${kacir(b.kisa_ad ?? b.ad)}</button>`).join('')}
      </div>
    </div>
    <div class="arama-kutu">
      <span class="slot-etiket">Takip no ara:</span>
      <input type="text" id="aramaNo" placeholder="Örn. K26-000012" class="mono">
      <button class="btn" id="aramaBtn" style="min-height:38px;padding:8px 16px">Ara</button>
      <span class="arama-sonuc" id="aramaSonuc"></span>
    </div>
    <div class="sekmeler">
      ${sekmeler.map(([k, ad]) => `<button data-s="${k}" ${k === SAYFA ? 'aria-current="page"' : ''}>${ad}</button>`).join('')}
    </div>
    <div class="kabuk">${
      SAYFA === 'panos' ? sayfaPanos() :
      SAYFA === 'triyaj' ? liste(KAYITLAR.filter(k => k.durum === 'triyaj'), 'Yönlendirme kutusu',
        'Yapay zekanın hangi birime ait olduğundan emin olamadığı işler. Doğru birime siz yönlendirirsiniz.') :
      SAYFA === 'bekleyen' ? liste(birimliKayitlar().filter(k => ['beklemede', 'cozuldu'].includes(k.durum)),
        'Onay bekleyenler', 'Tamamlandı diye işaretlendi, vatandaşın onaylaması bekleniyor.') :
      SAYFA === 'kapali' ? liste(birimliKayitlar().filter(k => ['kapandi', 'reddedildi', 'havale'].includes(k.durum)), 'Biten işler') :
      liste(birimliKayitlar().filter(k => ACIK_DURUMLAR.includes(k.durum) && k.durum !== 'triyaj'), 'Bana gelen işler')
    }</div>`;

  document.querySelectorAll('.slot-btn').forEach(b =>
    b.onclick = () => { SEC = b.dataset.slot; SAYFA = SEC === 'yonetici' ? 'panos' : 'gelen'; ciz(); });
  document.querySelectorAll('.sekmeler button').forEach(b =>
    b.onclick = () => { SAYFA = b.dataset.s; ciz(); });
  document.querySelectorAll('.is-kart[data-id]').forEach(b =>
    b.onclick = () => detayAc(b.dataset.id));

  document.getElementById('aramaBtn').onclick = aramaYap;
  document.getElementById('aramaNo').onkeydown = e => { if (e.key === 'Enter') aramaYap(); };
}

function birimliKayitlar() {
  return SEC === 'yonetici' ? KAYITLAR : KAYITLAR.filter(k => k.birim_id === SEC);
}

function aramaYap() {
  const girilen = document.getElementById('aramaNo').value.trim().toLocaleUpperCase('tr').replace(/\s/g, '');
  const sonucAlani = document.getElementById('aramaSonuc');
  if (!girilen) return;
  const bulunan = KAYITLAR.find(k =>
    (k.takip_no ?? '').toLocaleUpperCase('tr').replace(/\s/g, '') === girilen);
  if (bulunan) { sonucAlani.textContent = ''; detayAc(bulunan.id); }
  else sonucAlani.textContent = 'Bu numarayla kayıt bulunamadı.';
}

function yasSinifi(gun) { return gun >= 14 ? 'uzun' : gun >= 5 ? 'orta' : 'kisa'; }

function liste(kayitlar, baslik, aciklama) {
  const acik = birimliKayitlar().filter(k => ACIK_DURUMLAR.includes(k.durum));
  const yaslar = acik.map(k => yasGun(k.olusturma));
  const acilSayi = acik.filter(k => k.acil).length;
  const enEski = yaslar.length ? Math.max(...yaslar) : 0;

  return `
  <div class="ozet-satir">
    <div class="ozet"><div class="et">Elinizde kaç iş var</div>
      <div class="deger">${acik.length}</div><div class="alt">şu an açık</div></div>
    <div class="ozet ${enEski >= 14 ? 'dikkat' : ''}"><div class="et">En eski iş</div>
      <div class="deger">${enEski ? enEski.toFixed(0) : '—'}</div><div class="alt">gündür bekliyor</div></div>
    ${acilSayi > 0 ? `<div class="ozet dikkat"><div class="et">Acil işaretli</div>
      <div class="deger">${acilSayi}</div><div class="alt">önce bunlara bakın</div></div>` : ''}
  </div>
  ${aciklama ? `<p class="aciklama-kutu">${aciklama}</p>` : ''}
  ${kayitlar.length ? kayitlar.map(satirHTML).join('') : '<div class="bos">Şu an burada iş yok.</div>'}
  `;
}

function satirHTML(k) {
  const yas = yasGun(k.olusturma);
  const sinif = yasSinifi(yas);
  const fotoSayisi = (k.sikayet_ekleri ?? []).filter(e => e.dosya_yolu).length;
  return `<button class="is-kart" data-id="${k.id}" data-yas="${sinif}">
    <div class="is-ust">
      ${k.acil ? '<span class="rozet acil">Acil</span>' : ''}
      <span class="rozet ${k.durum}">${DURUM_ADI[k.durum] ?? k.durum}</span>
      <span class="baslik">${kacir(k.baslik ?? k.kategoriler?.ad ?? 'Başlıksız iş')}</span>
      <span class="is-yas ${sinif === 'uzun' ? 'uzun' : ''}">${yas.toFixed(0)} gündür</span>
    </div>
    <div class="is-alt">
      <span class="mono">${kacir(k.takip_no ?? '')}</span>
      <span>· ${kacir(k.mahalle_metin ?? 'Mahalle belirtilmemiş')}</span>
      ${k.adres ? `<span>· ${kacir(k.adres)}</span>` : ''}
      ${SEC === 'yonetici' && k.birimler?.ad ? `<span>· ${kacir(k.birimler.kisa_ad ?? k.birimler.ad)}</span>` : ''}
      ${fotoSayisi ? `<span class="foto-isareti">📷 ${fotoSayisi} fotoğraf</span>` : ''}
      ${k.destekleyen_sayisi > 1 ? `<span>· aynı sorunu bildiren ${k.destekleyen_sayisi} kişi</span>` : ''}
    </div>
  </button>`;
}

function sayfaPanos() {
  const birimler = new Map();
  for (const k of KAYITLAR) {
    const ad = k.birimler?.ad ?? 'Atanmamış';
    const o = birimler.get(ad) ?? { ad, toplam: 0, acik: 0, yaslar: [], sureler: [] };
    o.toplam++;
    if (ACIK_DURUMLAR.includes(k.durum)) { o.acik++; o.yaslar.push(yasGun(k.olusturma)); }
    if (k.cozum_tarihi) o.sureler.push((new Date(k.cozum_tarihi) - new Date(k.olusturma)) / 86400000);
    birimler.set(ad, o);
  }
  const satirlar = [...birimler.values()].sort((a, b) => b.acik - a.acik);

  return `
  <div class="uyari">Bu tablo <b>hedef süre kullanmaz</b>. Her birim kendi geçmişine göre gösterilir;
    "geç kaldı" hükmünü veri değil, işi bilen yönetici verir. Daha derin analiz için
    <b>Erken Uyarı Panosu</b>'nu kullanın.</div>
  <div style="background:var(--bone);border:1px solid var(--hair);border-radius:4px;overflow:hidden">
    <table>
      <tr><th>Birim</th><th class="sag">Toplam</th><th class="sag">Açık</th>
        <th class="sag">En eski açık (gün)</th><th class="sag">Tipik açık yaşı (gün)</th>
        <th class="sag">Tipik bitirme süresi (gün)</th></tr>
      ${satirlar.map(b => `<tr>
        <td><b>${kacir(b.ad)}</b></td>
        <td class="sag mono">${b.toplam}</td>
        <td class="sag mono">${b.acik}</td>
        <td class="sag mono">${b.yaslar.length ? Math.max(...b.yaslar).toFixed(0) : '—'}</td>
        <td class="sag mono">${b.yaslar.length ? medyan(b.yaslar).toFixed(1) : '—'}</td>
        <td class="sag mono">${b.sureler.length ? medyan(b.sureler).toFixed(1) : '—'}</td>
      </tr>`).join('')}
    </table>
  </div>`;
}

/* ---------------- detay ve işlemler ---------------- */

async function detayAc(id) {
  const k = KAYITLAR.find(x => x.id === id);
  const { data: hareketler } = await sb.from('sikayet_hareketleri')
    .select('islem, not_metni, olusturma, aktor').eq('sikayet_id', id)
    .order('olusturma', { ascending: true });

  document.getElementById('modal').innerHTML = `
    <div class="modal-bas">
      <div><h2>${kacir(k.baslik ?? k.kategoriler?.ad ?? 'Başlıksız iş')}</h2>
        <div class="no">${kacir(k.takip_no ?? '')}</div></div>
      <button class="btn" style="padding:8px 14px;min-height:auto;font-size:13px" id="kapat">Kapat</button>
    </div>
    <div class="modal-ic">
      <div class="bilgi">
        <span>Durum</span><b>${DURUM_ADI[k.durum] ?? k.durum}</b>
        <span>Konu</span><div>${kacir(k.kategoriler?.ad ?? '—')}</div>
        <span>Birim</span><div>${kacir(k.birimler?.ad ?? 'Henüz atanmamış')}</div>
        <span>Yer</span><div>${kacir(k.mahalle_metin ?? '—')} ${kacir(k.adres ?? '')}</div>
        <span>Ne zaman geldi</span><div>${new Date(k.olusturma).toLocaleString('tr-TR')}
          (${yasGun(k.olusturma).toFixed(0)} gün önce)</div>
        <span>Vatandaşın yazdığı</span><div>${kacir(k.ozet ?? '')}</div>
      </div>

      <div class="alan" id="fotoAlani" hidden>
        <label>Fotoğraflar</label>
        <div class="foto-serit" id="fotoSerit"><span class="foto-yukleniyor">Yükleniyor…</span></div>
      </div>

      ${k.durum === 'triyaj' ? `
        <div class="alan"><label>Bu iş hangi birime ait?</label>
          <select id="hedefBirim"><option value="">Birim seçin…</option>
            ${BIRIMLER.map(b => `<option value="${b.id}">${kacir(b.ad)}</option>`).join('')}</select></div>
        <button class="btn ana" id="yonlendir">Bu birime gönder</button>
      ` : ['kapandi', 'reddedildi', 'havale'].includes(k.durum) ? '' : `
        <div class="alan"><label>Ne yaptınız? (Bitti demek için bu alanı doldurun)</label>
          <textarea id="notMetni" placeholder="Örnek: Ekip gönderildi, çukur asfaltla dolduruldu."></textarea></div>
        <div class="eylemler">
          <button class="btn" data-durum="islemde">İşleme aldım</button>
          <button class="btn" data-durum="beklemede">Beklemeye al</button>
          <button class="btn yesil" data-durum="cozuldu">İş bitti</button>
          <button class="btn kirmizi" id="iade">Bu iş bize ait değil</button>
        </div>
      `}

      <div class="gecmis"><h3>Bu işte daha önce ne olmuş</h3>
        <ul>${(hareketler ?? []).map(h => `<li>
          <time>${new Date(h.olusturma).toLocaleString('tr-TR')}</time>
          <b>${kacir(h.islem)}</b> ${kacir(h.not_metni ?? '')}
          <span style="color:var(--ink-soft)"> — ${kacir(h.aktor)}</span></li>`).join('') || '<li>Kayıt yok.</li>'}</ul>
      </div>
    </div>`;

  document.getElementById('perde').classList.add('acik');
  document.getElementById('kapat').onclick = modalKapat;

  document.querySelectorAll('[data-durum]').forEach(b => b.onclick = () => durumIsle(k, b.dataset.durum));
  const iade = document.getElementById('iade');
  if (iade) iade.onclick = () => iadeEt(k);
  const yon = document.getElementById('yonlendir');
  if (yon) yon.onclick = () => yonlendir(k);

  fotolariYukle(k);
}

// Storage'daki fotoğrafları güvenli, süreli bağlantılarla getirip küçük resim şeridi olarak gösterir.
async function fotolariYukle(k) {
  const dosyalar = (k.sikayet_ekleri ?? []).filter(e => e.dosya_yolu);
  if (!dosyalar.length) return;
  document.getElementById('fotoAlani').hidden = false;

  const baglantilar = await Promise.all(dosyalar.map(async e => {
    const { data, error } = await sb.storage.from('sikayet-ekleri').createSignedUrl(e.dosya_yolu, 3600);
    return error ? null : data.signedUrl;
  }));

  const gecerli = baglantilar.filter(Boolean);
  const serit = document.getElementById('fotoSerit');
  if (!serit) return; // kullanıcı modalı bu arada kapatmış olabilir
  serit.innerHTML = gecerli.length
    ? gecerli.map(u => `<a href="${u}" target="_blank" rel="noopener"><img src="${u}" loading="lazy"></a>`).join('')
    : '<span class="foto-yukleniyor">Fotoğraflar açılamadı.</span>';
}

async function durumIsle(k, durum) {
  const not = document.getElementById('notMetni')?.value?.trim() ?? '';
  if (durum === 'cozuldu' && !not) {
    return alert('İşi bitti olarak işaretlemek için ne yaptığınızı yazmanız gerekiyor.');
  }
  const { error } = await sb.from('sikayetler').update({ durum }).eq('id', k.id);
  if (error) return alert('Kaydedilemedi: ' + error.message);

  if (durum === 'cozuldu') {
    await sb.from('cozum_raporlari').insert({ sikayet_id: k.id, aciklama: not });
    await sb.from('sikayet_hareketleri').insert({
      sikayet_id: k.id, aktor: 'kullanici', islem: 'cozuldu', not_metni: not });
  } else if (not) {
    await sb.from('sikayet_hareketleri').insert({
      sikayet_id: k.id, aktor: 'kullanici', islem: 'not_eklendi', not_metni: not });
  }
  modalKapat(); await kayitlariGetir(); ciz();
}

async function iadeEt(k) {
  const not = document.getElementById('notMetni')?.value?.trim() ?? '';
  if (!not) return alert('Bu işin neden size ait olmadığını kısaca yazmanız gerekiyor.');
  await sb.from('sikayet_hareketleri').insert({
    sikayet_id: k.id, aktor: 'kullanici', islem: 'iade', not_metni: not });
  const { error } = await sb.from('sikayetler')
    .update({ durum: 'triyaj', birim_id: null }).eq('id', k.id);
  if (error) return alert(error.message);
  modalKapat(); await kayitlariGetir(); ciz();
}

async function yonlendir(k) {
  const birimId = document.getElementById('hedefBirim').value;
  if (!birimId) return alert('Önce bir birim seçin.');
  const { error } = await sb.from('sikayetler')
    .update({ birim_id: birimId, durum: 'yeni' }).eq('id', k.id);
  if (error) return alert(error.message);
  await sb.from('sikayet_hareketleri').insert({
    sikayet_id: k.id, aktor: 'kullanici', islem: 'yonlendirildi' });
  modalKapat(); await kayitlariGetir(); ciz();
}

function modalKapat() { document.getElementById('perde').classList.remove('acik'); }
document.getElementById('perde').onclick = e => { if (e.target.id === 'perde') modalKapat(); };

/* ---------------- yardımcı ---------------- */

function yasGun(t) { return (Date.now() - new Date(t).getTime()) / 86400000; }
function medyan(d) {
  const s = [...d].sort((a, b) => a - b), o = Math.floor(s.length / 2);
  return s.length % 2 ? s[o] : (s[o - 1] + s[o]) / 2;
}
function kacir(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
